# fly.toml app configuration file generated for yohawallpaper-api on 2026-08-30T17:24:07-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'yohawallpaper-api'
primary_region = 'dfw'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
[mounts]
  source = "yohawallpaper_data"
  destination = "/data"
